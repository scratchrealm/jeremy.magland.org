# Isso configuration for the comments on jeremy.magland.org. Options not set
# here keep Isso's defaults (see isso/isso.cfg in the Isso repository).

[general]
# SQLite database on the Fly volume mounted at /db (see fly.toml).
dbpath = /db/comments.db
host = https://jeremy.magland.org
# New comments are logged to stdout (visible with `fly logs`) and emailed to
# the moderator (see [smtp]). Commenters never get email.
notify = stdout, smtp
reply-notifications = false
gravatar = false

[server]
listen = http://0.0.0.0:8080
public-endpoint = https://jeremy-comments.magland.org
# Left empty on purpose: Isso already takes the client address from the last
# X-Forwarded-For entry, which Fly's proxy appends.
trusted-proxies =

[moderation]
# Hold every comment for approval in the admin UI, with no automatic approval
# (comments are anonymous, so there is no email to recognize anyway).
enabled = true
approve-if-email-previously-approved = false
purge-after = 30d

[guard]
# Default rate limits: 2 comments per minute and 3 top-level comments per
# thread from one address.
enabled = true
ratelimit = 2
direct-reply = 3
reply-to-self = false
require-author = false
require-email = false

[smtp]
# Moderation email for each new comment, with links to activate or delete it.
# Sent through Gmail with an app password; the address and password are Fly
# secrets so that they stay out of this public repo. If they are missing,
# Isso logs the failed send and comments still work.
host = smtp.gmail.com
port = 587
security = starttls
username = ${ISSO_SMTP_USER}
password = ${ISSO_SMTP_PASSWORD}
from = "jeremy.magland.org comments" <${ISSO_SMTP_USER}>
to = ${ISSO_SMTP_USER}
timeout = 10

[admin]
enabled = true
# Set with `fly secrets set ISSO_ADMIN_PASSWORD=...`. The Dockerfile refuses
# to start without it, since Isso would otherwise use this literal string.
password = ${ISSO_ADMIN_PASSWORD}
