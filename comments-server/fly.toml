# fly.toml app configuration file generated for jeremy-comments on 2026-09-30T10:18:11-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jeremy-comments'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'isso_db'
  destination = '/db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
